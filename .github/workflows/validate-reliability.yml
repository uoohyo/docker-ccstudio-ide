name: Validate release reliability

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'
      - 'tests/**'
      - 'entrypoint.sh'

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate shell syntax
        run: |
          bash -n entrypoint.sh
          find .github/scripts -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Run offline regression tests
        run: python3 -m unittest discover -s tests -v
